<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      body { font-family: sans-serif; padding: 15px; }
      #result { font-size: 24px; font-weight: bold; margin-top: 10px; color: #1a73e8; }
      button { 
        padding: 10px 20px; background-color: #1a73e8; color: white; 
        border: none; border-radius: 4px; cursor: pointer; width: 100%;
      }
      button:hover { background-color: #1557b0; }
      
      /* New CSS for the breakdown list */
      #breakdown-container { margin-top: 20px; font-size: 13px; }
      .breakdown-row { 
        display: flex; 
        justify-content: space-between; 
        border-bottom: 1px solid #e0e0e0; 
        padding: 6px 0; 
      }
      .breakdown-header { font-weight: bold; margin-bottom: 5px; color: #555; }
    </style>
  </head>
  <body>
    <h3>Sum of Dept GSM</h3>
    <p>Click the button below to scan all sheets and calculate the total.</p>
    
    <button onclick="runCalculation()">Calculate Total</button>
    
    <div id="result">---</div>
    
    <div id="breakdown-container"></div>

    <script>
      function runCalculation() {
        // Reset text and clear previous breakdown while it loads
        document.getElementById('result').innerText = "Calculating...";
        document.getElementById('result').style.color = "#1a73e8";
        document.getElementById('breakdown-container').innerHTML = ""; 
        
        google.script.run
          .withSuccessHandler(showResult)
          .withFailureHandler(showError)
          .calculateTotalGSM();
      }

      function showResult(data) {
        // 1. Show the grand total
        document.getElementById('result').innerText = data.total;
        
        // 2. Build the breakdown list HTML
        let html = "<div class='breakdown-header'>Breakdown per sheet:</div>";
        
        if (data.breakdown.length === 0) {
          html += "<p style='color: #888;'>No GSM data found.</p>";
        } else {
          data.breakdown.forEach(function(item) {
            html += `<div class="breakdown-row">
                       <span>${item.name}</span>
                       <strong>${item.value}</strong>
                     </div>`;
          });
        }
        
        // 3. Inject it into the sidebar
        document.getElementById('breakdown-container').innerHTML = html;
      }

      function showError(err) {
        document.getElementById('result').style.color = "red";
        document.getElementById('result').innerText = "Error: " + err.message;
        console.error(err);
      }
    </script>
  </body>
</html>
